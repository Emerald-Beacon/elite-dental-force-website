  <style>
    .btn-primary::after { animation-name: home-shimmer-sweep; }
    body { --font: 'EDF Error Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); min-height: 100vh; display: flex; flex-direction: column; }
    .err-page {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 5rem 1.5rem; position: relative; overflow: hidden;
    }
    .err-grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(75,168,240,0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(75,168,240,0.045) 1px, transparent 1px);
      background-size: 60px 60px; pointer-events: none;
    }
    .err-grid::after {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse 70% 70% at 50% 50%, transparent 30%, var(--bg) 100%);
    }
    .err-orb {
      position: absolute; border-radius: 50%; pointer-events: none; filter: blur(120px);
    }
    .err-orb--1 { width: 500px; height: 500px; background: #001f71; opacity: 0.45; top: -100px; left: -150px; }
    .err-orb--2 { width: 350px; height: 350px; background: rgba(255,215,0,0.15); opacity: 0.35; bottom: -80px; right: -100px; }
    .err-inner { position: relative; z-index: 2; text-align: center; max-width: 560px; }
    .err-code {
      font-size: clamp(7rem, 18vw, 11rem); font-weight: 800; line-height: 1;
      background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, #ffd700 50%, #f59e0b 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      margin: 0 0 0.5rem; letter-spacing: -0.04em;
    }
    .err-title { font-size: clamp(1.25rem, 3vw, 1.75rem); font-weight: 700; color: #f0f7ff; margin: 0 0 1rem; }
    .err-desc { font-size: 1rem; color: rgba(133,184,216,0.75); line-height: 1.65; margin: 0 0 2.5rem; }
    .err-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .err-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 24px; border-radius: 10px;
      font-family: 'EDF Error Sans', sans-serif; font-size: 14px; font-weight: 700;
      text-decoration: none; transition: all 0.25s ease;
    }
    .err-btn--primary {
      background: linear-gradient(135deg, #095ba7, #1777c8); color: #fff; border: none;
